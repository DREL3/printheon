name: "🐞 Something's wrong / Algo no va bien"
description: "Something in the app doesn't work as it should. / Algo de la app no funciona como debe."
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened? / ¿Qué ha pasado?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect? / ¿Qué esperabas que pasara?"
  - type: input
    id: printer
    attributes:
      label: "Printer and connection / Impresora y conexión"
      placeholder: "Voron 2.4 · Klipper"
  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshot / Captura"
      description: "Drag an image here if you have one. / Arrastra aquí una imagen si la tienes."
