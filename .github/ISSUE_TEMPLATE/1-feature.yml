name: "💡 Feature request / Pedir una función"
description: "Something you'd like Printheon to do. / Algo que te gustaría que hiciera Printheon."
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "What would you like? / ¿Qué te gustaría?"
      description: "Tell it the way you'd tell a friend. / Cuéntalo como se lo contarías a un amigo."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: "How do you do it today? / ¿Cómo lo haces hoy?"
      description: "Which app or trick do you use now? / ¿Qué programa o truco usas ahora?"
  - type: input
    id: printer
    attributes:
      label: "Your printer / Tu impresora"
      placeholder: "Bambu Lab P1S, Ender 3 V3, Voron 2.4…"
